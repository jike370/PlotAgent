[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "plotagent"
version = "0.1.0"
description = "A conversation-driven scientific plotting agent."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "kaleido>=1.0,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "openai>=1.100,<3",
  "openpyxl>=3.1,<4",
  "originpro>=1.1,<2",
  "orjson>=3.10,<4",
  "pandas>=2.2,<4",
  "plotly>=6.0,<7",
  "pyarrow>=18,<24",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.18,<1",
  "scipy>=1.14,<2",
  "uvicorn[standard]>=0.34,<1",
  "xlrd>=2.0.1,<3",
]

[project.scripts]
plotagent-contracts = "plotagent.contracts.codegen:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
release = [
  "build>=1.2,<2",
  "pyinstaller>=6.15,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/plotagent"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "origin_live: requires the build-pinned local Origin and PLOTAGENT_RUN_ORIGIN_LIVE=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["plotagent"]

